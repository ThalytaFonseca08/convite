<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Um convite para Samille</title>
<style>
:root{
  --bg:#dcebd8; --bg2:#c4dcc0; --env:#2f6b4a; --env-dark:#245538; --flap:#3b7d58;
  --paper:#fbfdf6; --ink:#1e4630; --seal:#c9a24a; --yes:#2f6b4a; --yes-ink:#fbfdf6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f2218; --bg2:#173225; --paper:#f1f6e8; --ink:#1e4630;}
}
:root[data-theme="dark"]{--bg:#0f2218; --bg2:#173225; --paper:#f1f6e8; --ink:#1e4630;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg));font-family:Georgia,"Palatino Linotype",serif;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink)}
.stage{position:relative;width:min(340px,86vw);height:230px;perspective:1000px;cursor:pointer;transition:transform .8s}
.stage.open{transform:translateY(120px)}
.env{position:absolute;inset:0;background:var(--env);border-radius:6px;box-shadow:0 18px 40px rgba(20,60,40,.35)}
.front{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:
   linear-gradient(to top right,transparent 49.5%,var(--env-dark) 50%) left/50% 100% no-repeat,
   linear-gradient(to top left,transparent 49.5%,var(--env-dark) 50%) right/50% 100% no-repeat;
  clip-path:polygon(0 0,0 100%,100% 100%,100% 0,50% 58%);border-radius:6px;opacity:.9}
.flap{position:absolute;left:0;top:0;width:100%;height:58%;z-index:5;background:var(--flap);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease,z-index 0s .35s}
.stage.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:58%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:6;
  background:var(--seal);display:grid;place-items:center;color:#fff8e0;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:opacity .3s}
.stage.open .seal{opacity:0}
.hint{position:absolute;left:0;right:0;bottom:-46px;text-align:center;font-style:italic;color:var(--env);font-size:1rem;transition:opacity .3s}
.stage.open .hint{opacity:0}
.letter{position:absolute;left:6%;width:88%;top:8%;height:84%;background:var(--paper);z-index:2;border-radius:4px;
  padding:20px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;
  transform:translateY(0);transition:transform .9s .35s ease,height .9s .35s ease;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden}
.stage.open .letter{transform:translateY(-250px);height:300px;z-index:3}
.letter *{opacity:0;transition:opacity .6s 1s}
.stage.open .letter *{opacity:1}
.letter h1{font-size:1.55rem;line-height:1.25;margin:0;font-weight:700;color:var(--ink)}
.letter p{margin:0;font-style:italic;color:var(--env)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;min-height:46px;width:100%}
button{font:inherit;font-size:1rem;border-radius:999px;padding:10px 22px;cursor:pointer;border:2px solid var(--yes)}
button:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
#sim{background:var(--yes);color:var(--yes-ink)}
#nao{background:transparent;color:var(--yes)}
.final{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.final.show{display:flex}
.final h2{font-size:2rem;margin:0}
.final p{margin:0;font-size:1.15rem;color:var(--env)}
.leaf{position:fixed;top:-30px;font-size:22px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage" tabindex="0" role="button" aria-label="Abrir o convite">
  <div class="env"></div>
  <div class="letter">
    <p>Para Samille</p>
    <h1>Samille, você aceita sair comigo?</h1>
    <div class="btns">
      <button id="sim">Aceito 💚</button>
      <button id="nao">Não</button>
    </div>
  </div>
  <div class="front"></div>
  <div class="flap"></div>
  <div class="seal">❦</div>
  <div class="hint">Toque para abrir</div>
</div>

<div class="final" id="final" aria-live="polite">
  <h2>Ela disse sim! 🌿</h2>
  <p>Combinado, Samille. Mal posso esperar.</p>
</div>

<script>
const stage=document.getElementById('stage'),sim=document.getElementById('sim'),nao=document.getElementById('nao'),fin=document.getElementById('final');
function abrir(){stage.classList.add('open');stage.style.cursor='default';stage.removeAttribute('tabindex');stage.removeAttribute('role')}
stage.addEventListener('click',e=>{if(!stage.classList.contains('open'))abrir()});
stage.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!stage.classList.contains('open')){e.preventDefault();abrir()}});
let fugas=0;
function fugir(e){
  e.preventDefault();e.stopPropagation();
  fugas++;
  const x=(Math.random()-.5)*140,y=(Math.random()-.5)*90;
  nao.style.position='relative';nao.style.transform=`translate(${x}px,${y}px)`;
  nao.style.transition='transform .25s';
  if(fugas>=3){nao.textContent='Tá bom, sim 😄';nao.onclick=aceitar}
}
nao.addEventListener('mouseenter',e=>{if(fugas<3)fugir(e)});
nao.addEventListener('touchstart',e=>{if(fugas<3)fugir(e)},{passive:false});
nao.addEventListener('click',e=>{if(fugas<3)fugir(e)});
function aceitar(e){
  if(e)e.stopPropagation();
  fin.classList.add('show');
  for(let i=0;i<40;i++){
    const l=document.createElement('div');l.className='leaf';l.textContent=['🍃','🌿','💚'][i%3];
    l.style.left=Math.random()*100+'vw';l.style.animationDuration=(2.5+Math.random()*3)+'s';l.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(l);setTimeout(()=>l.remove(),7000);
  }
}
sim.addEventListener('click',aceitar);
</script>
</body>
</html>
